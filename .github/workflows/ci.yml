
name: DevOps Assignment CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate OpsPriority Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DevOps Assignment repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check website files exist
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js

      - name: Validate JavaScript syntax
        run: node --check app.js

        
      - name: Validate priority module syntax
        run: node --check priority.js

      - name: Run automated unit tests
        run: node --test tests/priority.test.js
        
      - name: Package application
        run: |
          mkdir -p dist
          cp index.html styles.css app.js priority.js dist/
          cd dist
          zip -r ../opspriority-release.zip .

      - name: Upload deployment artefact
        uses: actions/upload-artifact@v4
        with:
          name: opspriority-release
          path: opspriority-release.zip
          if-no-files-found: error
          retention-days: 14



      - name: Confirm validation complete
        run: echo "OpsPriority validation successful"
